<link href="popup.css" rel="stylesheet" type="text/css" />
<link rel="stylesheet" href="output.css">
<script type="module" src="popup.js"></script>

<div class="w-72 h-96 p-4 bg-gray-900 text-white flex flex-col gap-3">
  <h1 class="text-lg font-bold">Target History Remover</h1>

  <div class="flex gap-2">
    <input id="addField" placeholder="....."
      class="flex-1 px-2 py-1 rounded bg-gray-800 border border-gray-700 outline-none focus:border-blue-500" />
    <button id="addButton"
      class="w-10 px-3 py-1 rounded bg-blue-600 hover:bg-blue-500 text-sm">Add </button>
  </div>

  <div>
    <h3 class="my-2">Auto Removed Keywords:</h3>
    <div id="keywordList" class="flex flex-wrap gap-2 max-h-48 overflow-y-auto text-sm"></div>
  </div>

  <button id="removeHistoryButton"
    class="mt-auto w-full py-2 rounded bg-red-600 hover:bg-red-500 font-semibold">Clear now</button>
</div>
